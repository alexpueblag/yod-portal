<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DUMMY C · Semáforo de un vistazo · YOD OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css?v=0.5.0">
<style>
:root{--ok:#39744b;--warn:#b58a2e;--bad:#a94438}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:22px 22px 60px}
.dummy-tag{position:fixed;top:12px;right:12px;z-index:60;background:var(--ink);color:#f6f3ed;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;border-radius:999px;opacity:.85}
/* banner de decisión: iconos, no párrafos */
.banner{background:var(--ink);color:#f6f3ed;border-radius:14px;padding:16px 20px;display:flex;gap:18px;align-items:center;box-shadow:var(--shadow);margin-bottom:34px;flex-wrap:wrap}
.banner .lbl{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#bda875;margin-right:6px}
.dec{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.dec i{font-size:20px;color:#ead8b5}.dec b{font-family:'Instrument Serif';font-size:22px;font-weight:400}
.dec.pulse{animation:lat 1.8s ease-in-out infinite;border-color:rgba(154,123,63,.7)}
@keyframes lat{0%,100%{box-shadow:0 0 0 0 rgba(154,123,63,.0)}50%{box-shadow:0 0 0 8px rgba(154,123,63,.18)}}
.banner .sp{flex:1}
.b-btn{border:0;border-radius:9px;padding:11px 16px;font:600 12px 'Instrument Sans',sans-serif;cursor:pointer;background:var(--gold);color:var(--ink);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
/* el sistema solar de KPI */
.sky{position:relative;height:520px;display:grid;place-items:center}
.orb{position:absolute;display:grid;place-items:center;text-decoration:none;color:inherit;cursor:pointer;transition:transform .5s cubic-bezier(.2,.8,.2,1),left .5s,top .5s,width .5s,height .5s}
.orb .ring{position:absolute;inset:0;border-radius:50%;border:10px solid var(--c);opacity:.22}
.orb .ring2{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff 0 58%,transparent 60%);}
.orb .lab{position:absolute;bottom:-30px;white-space:nowrap;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.orb .core{position:relative;display:grid;place-items:center;gap:6px}
.orb .dot{width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 22%,transparent)}
.orb svg{display:block}
.orb .num{display:none;font-family:'Instrument Serif';font-size:56px;line-height:1;color:var(--ink)}
.orb.rey{width:300px;height:300px;left:calc(50% - 150px);top:calc(50% - 150px)}
.orb.rey .num{display:block}.orb.rey .dot{display:none}.orb.rey .lab{bottom:-34px;font-size:12px;color:var(--ink)}
.orb.rey .ring{border-width:14px;opacity:.28}
.orb.sat{width:130px;height:130px}
.orb.sat:hover .num{display:block;font-size:34px}.orb.sat:hover .dot{display:none}
.orb.sat:hover{transform:scale(1.08)}
.hint{text-align:center;color:var(--muted);font-size:11px;margin-top:6px}
/* leyenda semáforo */
.leg{display:flex;justify-content:center;gap:22px;font-size:11px;color:var(--muted);margin:14px 0 40px}
.leg span{display:inline-flex;align-items:center;gap:6px}.leg i{width:10px;height:10px;border-radius:50%;display:inline-block}
/* fichas con anillo + corona */
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.pz{position:relative;text-align:center}
.pz .cov{width:120px;height:120px;border-radius:50%;object-fit:cover;display:block;margin:0 auto;border:4px solid #fff;box-shadow:var(--shadow)}
.pz .ringp{position:absolute;left:50%;top:0;width:128px;height:128px;transform:translateX(-50%);pointer-events:none}
.pz .ringp circle{fill:none;stroke-width:5}
.pz .crown{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:22px;color:var(--gold)}
.pz .crown.hollow{opacity:.45}
.pz .name{font-size:12px;margin-top:10px;color:var(--ink)}
.pz .st{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pz.needs .cov{outline:3px solid var(--gold);outline-offset:3px;animation:lat 1.8s infinite}
h2.sec{font-family:'Instrument Serif';font-weight:400;font-size:22px;margin:0 0 4px}
.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.13em;font-size:10px;font-weight:600}
@media (max-width:640px){.sky{height:420px}.orb.rey{width:220px;height:220px;left:calc(50% - 110px);top:calc(50% - 110px)}.orb.rey .num{font-size:44px}.orb.sat{width:84px;height:84px}.orb.sat .lab{display:none}}
</style></head><body>
<div class="dummy-tag">dummy C · datos ficticios</div>
<div class="wrap">

<div class="banner">
  <span class="lbl">Te toca decidir</span>
  <span class="dec pulse" title="láminas por revisar"><i class="ti ti-photo-check"></i><b>7</b></span>
  <span class="dec" title="pieza que pide coronarse"><i class="ti ti-crown"></i><b>1</b></span>
  <span class="dec" title="audio por aprobar"><i class="ti ti-microphone"></i><b>1</b></span>
  <span class="sp"></span>
  <a class="b-btn" href="https://alexpueblag.github.io/sala-edicion/"><i class="ti ti-player-play"></i>Revisar · ≈5 min</a>
</div>

<div class="sky" id="sky"></div>
<p class="hint">Toca un círculo para hacerlo el KPI rey · acércate para ver su número</p>
<div class="leg"><span><i style="background:var(--ok)"></i>en meta</span><span><i style="background:var(--warn)"></i>cerca</span><span><i style="background:var(--bad)"></i>lejos</span></div>

<p class="eyebrow">Piezas</p><h2 class="sec">Del guion a la corona</h2>
<div class="pieces" id="pieces"></div>
</div>

<script>
const KPI=[
 {k:'leads',lab:'Leads al Plan de Potencial',v:6,meta:8,tr:[1,2,2,3,4,4,6],src:'liga fb/ig-2026-08-04'},
 {k:'citas',lab:'Videollamadas agendadas',v:2,meta:4,tr:[0,0,1,1,1,2,2],src:'Calendar'},
 {k:'tasa',lab:'Tasa a la primera · Sala',v:86,meta:80,tr:[38,86,57,86,100,86,86],unit:'%',src:'Sheet Sala'},
 {k:'dias',lab:'Días de idea a publicada',v:9,meta:7,tr:[14,12,11,10,9,9,9],src:'parrilla'},
 {k:'alc',lab:'Alcance por pieza',v:1.4,meta:2,tr:[.6,.9,1.1,1.2,1.4,1.4,1.4],unit:'k',src:'Meta Graph'},
];
let rey='leads';
function color(k){const r=k.k==='dias'?k.meta/k.v:k.v/k.meta;return r>=1?'var(--ok)':r>=.7?'var(--warn)':'var(--bad)'}
function spark(tr,c,w,h){const mx=Math.max(...tr),mn=Math.min(...tr);const pts=tr.map((v,i)=>`${i/(tr.length-1)*w},${h-(v-mn)/((mx-mn)||1)*h}`).join(' ');return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function pinta(){
  const sky=document.getElementById('sky'); sky.innerHTML='';
  const W=sky.clientWidth,H=sky.clientHeight,cx=W/2,cy=H/2,R=Math.min(W,H)/2-40;
  const sats=KPI.filter(k=>k.k!==rey); const kr=KPI.find(k=>k.k===rey);
  const mk=(k,cls,x,y)=>{const c=color(k);const el=document.createElement('a');el.className='orb '+cls;el.style.setProperty('--c',c);
    if(x!=null){el.style.left=(x-65)+'px';el.style.top=(y-65)+'px'}
    el.innerHTML=`<span class="ring2"></span><span class="ring"></span><span class="core"><span class="dot"></span><span class="num">${k.v}${k.unit||''}</span>${spark(k.tr,c,cls==='rey'?150:70,cls==='rey'?38:22)}</span><span class="lab">${k.lab}</span>`;
    el.title=`${k.lab}: ${k.v}${k.unit||''} · meta ${k.meta}${k.unit||''} · fuente ${k.src}`;
    el.onclick=()=>{rey=k.k;pinta()}; sky.appendChild(el)};
  mk(kr,'rey');
  sats.forEach((k,i)=>{const a=-Math.PI/2+i*(2*Math.PI/sats.length);mk(k,'sat',cx+Math.cos(a)*R,cy+Math.sin(a)*R)});
}
const PZ=[
 {n:'El terreno que dijo que sí',st:'publicada',p:5,crown:'hollow',img:'https://alexpueblag.github.io/sala-edicion/laminas/servilleta-final/L7.png'},
 {n:'La Servilleta',st:'video',p:4,img:'https://alexpueblag.github.io/sala-edicion/laminas/servilleta-final/L2.png'},
 {n:'El Apodo del Terreno',st:'láminas · te toca',p:3,needs:1,img:'https://alexpueblag.github.io/sala-edicion/laminas/apodo-g1/L1.png'},
 {n:'La Obra que No Empezó',st:'idea',p:1,img:''},
 {n:'Así Se Ve Saber (reel)',st:'idea',p:1,img:''},
];
document.getElementById('pieces').innerHTML=PZ.map(p=>{
  const C=2*Math.PI*59, dash=C*p.p/5;
  return `<div class="pz ${p.needs?'needs':''}">${p.crown?`<i class="ti ti-crown crown ${p.crown}"></i>`:''}
   ${p.img?`<img class="cov" src="${p.img}" alt="">`:`<div class="cov" style="background:var(--paper-2)"></div>`}
   <svg class="ringp" viewBox="0 0 128 128"><circle cx="64" cy="64" r="59" stroke="var(--line)"/><circle cx="64" cy="64" r="59" stroke="var(--gold)" stroke-dasharray="${dash} ${C}" transform="rotate(-90 64 64)" stroke-linecap="round"/></svg>
   <div class="name">${p.n}</div><div class="st">${p.st}</div></div>`}).join('');
pinta(); addEventListener('resize',pinta);
</script></body></html>
